<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICSnet</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-logo">
        <img data-fetch-img="assets/icons/logo.svg" alt="ICSnet Logo" class="logo-img">
        <span>ICSnet</span>
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-menu">
          <li><a href="/" class="nav-link active" data-fetch-text="assets/text/nav_home.txt">Home</a></li>
          <li><a href="/about/" class="nav-link" data-fetch-text="assets/text/nav_about.txt">About</a></li>
          <li><a href="/services/" class="nav-link" data-fetch-text="assets/text/nav_services.txt">Services</a></li>
          <li><a href="/contact/" class="nav-link" data-fetch-text="assets/text/nav_contact.txt">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h1 data-fetch-text="assets/text/home_title.txt">Loading...</h1>
    
    <div class="hero-card">
      <img data-fetch-img="assets/pictures/hero.webp" alt="Hero Picture" class="card-img">
      <div class="card-content">
        <h2 data-fetch-text="assets/text/hero_subtitle.txt">Loading...</h2>
        <p data-fetch-text="assets/text/hero_description.txt">Loading content...</p>
        <a href="#" class="btn" data-fetch-link="assets/links/action_url.txt" data-fetch-text="assets/text/action_label.txt">Action</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p data-fetch-text="assets/text/footer_text.txt">&copy; 2026 ICSnet. All rights reserved.</p>
  </footer>

  <script>
    const FALLBACK_IMG = "https://raw.githubusercontent.com/der46er/icsnet/main/assets/cat.webp";

    // Global Image Error Fallback Handler
    document.addEventListener("error", function (e) {
      if (e.target.tagName.toLowerCase() === "img" && e.target.src !== FALLBACK_IMG) {
        e.target.src = FALLBACK_IMG;
      }
    }, true);

    // Modular Asset Fetcher
    async function loadModularContent() {
      // 1. Fetch Text Snippets
      document.querySelectorAll("[data-fetch-text]").forEach(async (el) => {
        const path = el.getAttribute("data-fetch-text");
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          el.textContent = await res.text();
        } catch (err) {
          console.warn(`Failed to fetch text: ${path}`, err);
        }
      });

      // 2. Fetch/Assign Dynamic Images & Icons
      document.querySelectorAll("[data-fetch-img]").forEach((el) => {
        const path = el.getAttribute("data-fetch-img");
        el.src = path;
      });

      // 3. Fetch Dynamic Link Targets
      document.querySelectorAll("[data-fetch-link]").forEach(async (el) => {
        const path = el.getAttribute("data-fetch-link");
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          el.href = (await res.text()).trim();
        } catch (err) {
          console.warn(`Failed to fetch link: ${path}`, err);
        }
      });
    }

    document.addEventListener("DOMContentLoaded", loadModularContent);
  </script>
</body>
</html>
